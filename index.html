<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Kopi Feeling</title>
    <style>
        /* Gaya Global */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #b71c1c; margin-top: 0; margin-bottom: 20px; }
        
        /* Area Formulir Utama */
        .form-group { margin-bottom: 15px; }
        label.form-label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        select, input[type="text"].form-control, input[type="number"].form-control { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        
        /* Area Pesanan Merah */
        .order-area { background-color: #b71c1c; padding: 20px; border-radius: 12px; margin-top: 20px; color: white; }
        .order-area h3 { margin-top: 0; margin-bottom: 20px; font-weight: normal; font-size: 1.3rem; }
        
        /* Baris Pesanan Tunggal */
        .order-row { display: flex; align-items: center; background: white; padding: 10px; border-radius: 20px; margin-bottom: 10px; gap: 10px; box-sizing: border-box; }
        .order-row-label { color: #b71c1c; display: block; margin-bottom: 4px; font-size: 0.9rem; font-weight: bold; }
        .menu-col { flex-grow: 1; position: relative; }
        .menu-select-custom { background: white; border: 1px solid #ddd; border-radius: 15px; padding: 10px 12px; cursor: pointer; color: #333; display: flex; justify-content: space-between; align-items: center; text-decoration: none; box-sizing: border-box; width: 100%; height: 40px; font-size: 0.9rem; }
        .menu-select-custom span.menu-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .qty-col { width: 70px; flex-shrink: 0; position: relative; }
        .qty-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 15px; background: white; color: #333; text-align: center; height: 40px; font-size: 0.9rem; box-sizing: border-box; -moz-appearance: textfield; }
        .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .remove-col { width: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .btn-remove { width: 30px; height: 30px; background-color: white; color: #03a9f4; border: 1px solid #03a9f4; border-radius: 10px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-sizing: border-box; }
        .btn-add { background-color: #b71c1c; color: white; border: 1px solid white; border-radius: 20px; cursor: pointer; padding: 10px 20px; font-size: 1rem; }
        .add-menu-container { display: flex; justify-content: start; margin-top: 15px; }
        
        /* Modal Pilih Menu */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 5% auto; padding: 25px; border: none; width: 90%; max-width: 500px; border-radius: 20px; position: relative; box-sizing: border-box; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h4 { margin: 0; font-size: 1.3rem; color: #333; }
        .close-modal { color: #999; font-size: 1.5rem; font-weight: bold; cursor: pointer; background: white; border: 1px solid #999; border-radius: 10px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .search-container { position: relative; margin-bottom: 15px; }
        .search-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 15px; box-sizing: border-box; font-size: 1rem; }
        .search-input:focus { outline: none; border-color: #03a9f4; }
        .menu-list-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; max-height: 300px; overflow-y: auto; }
        .menu-item-tag { background-color: #eeeeee; color: #333; border: none; border-radius: 15px; padding: 8px 15px; cursor: pointer; font-size: 0.9rem; }
        .btn-cancel { background-color: white; color: #b71c1c; border: 1px solid #b71c1c; border-radius: 20px; cursor: pointer; padding: 12px; font-size: 1rem; width: 100%; box-sizing: border-box; }
        
        /* Bagian Bawah Halaman */
        .total-box { font-size: 1.4rem; font-weight: bold; text-align: right; margin: 20px 0; padding: 15px; background: #e8f5e9; border-radius: 8px; color: #333; }
        .payment-methods { display: flex; gap: 20px; margin-top: 5px; }
        .payment-methods label { display: flex; align-items: center; gap: 5px; font-weight: normal; }
        
        /* Area Kalkulator Tunai */
        #cash-section { background: #e3f2fd; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #bbdefb; }
        .change-box { font-size: 1.2rem; font-weight: bold; margin-top: 10px; text-align: right; }

        .btn-submit { background-color: #4CAF50; color: white; width: 100%; font-size: 1.2rem; padding: 15px; margin-top: 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; box-sizing: border-box; }
        .btn-submit:disabled { background-color: #a5d6a7; cursor: not-allowed; }

        @media (max-width: 400px) {
            .order-row { gap: 5px; padding: 8px; }
            .qty-col { width: 60px; }
            .menu-select-custom, .qty-input { font-size: 0.8rem; height: 36px; padding: 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kasir Kopi Feeling</h2>
    
    <div class="form-group">
        <label class="form-label">Station Gerobak</label>
        <select id="station">
            <option value="Station Sudirman">Station Sudirman</option>
            <option value="Station Kemang">Station Kemang</option>
            <option value="Station Blok M">Station Blok M</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label">Shift</label>
        <select id="shift">
            <option value="Shift 1">Shift 1 (Pagi - Sore)</option>
            <option value="Shift 2">Shift 2 (Sore - Malam)</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label">Nama Pilot Gerobak</label>
        <input type="text" id="pilot" class="form-control" placeholder="Masukkan nama pilot..." required>
    </div>

    <div class="order-area">
        <h3>Detail Pesanan</h3>
        <div id="order-row-container">
            </div>
        <div class="add-menu-container">
            <button class="btn-add" onclick="addOrderRow()">+ Tambah Menu</button>
        </div>
    </div>

    <div class="total-box">
        Total: Rp <span id="total-price">0</span>
    </div>

    <div class="form-group">
        <label class="form-label">Metode Pembayaran</label>
        <div class="payment-methods">
            <label><input type="radio" name="pembayaran" value="Cash" checked onchange="toggleCashSection()"> Cash</label>
            <label><input type="radio" name="pembayaran" value="QRIS" onchange="toggleCashSection()"> QRIS</label>
        </div>
    </div>

    <div id="cash-section">
        <div class="form-group" style="margin-bottom: 5px;">
            <label class="form-label">Nominal Uang Diberikan (Rp)</label>
            <input type="number" id="cash-given" class="form-control" placeholder="Contoh: 50000" oninput="calculateTotal()">
        </div>
        <div class="change-box">
            Kembalian: <span id="change-amount">Rp 0</span>
        </div>
    </div>

    <button class="btn-submit" onclick="submitData()">Kirim Transaksi</button>
</div>

<div id="menu-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h4>Pilih Menu</h4>
            <span class="close-modal" onclick="closeMenuModal()">×</span>
        </div>
        <div class="search-container">
            <input type="text" id="search-menu" class="search-input" placeholder="Cari menu..." onkeyup="filterMenuList()">
        </div>
        <div id="menu-list" class="menu-list-container"></div>
        <button class="btn-cancel" onclick="closeMenuModal()">Batal</button>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP ANDA DI SINI
    const scriptURL = 'MASUKKAN_URL_WEB_APP_ANDA_DI_SINI';

    const menuItems = {
        "Be Carefeels": 18000,
        "Our Feeling": 15000,
        "Happy Feels": 20000,
        "Mocafeels": 22000,
        "Rushfeels": 20000,
        "Vanfeels": 18000,
        "Nutfeels": 20000,
        "Blackfeels": 15000,
        "Chocofeels": 20000,
        "Greenfeels": 22000,
        "Red Deveels": 25000
    };

    let currentRowId = null;

    function addOrderRow() {
        const container = document.getElementById('order-row-container');
        const rowId = 'row-' + Date.now();
        const rowHTML = `
            <div class="order-row" id="${rowId}">
                <div class="menu-col">
                    <label class="order-row-label">Menu</label>
                    <a href="javascript:void(0)" class="menu-select-custom" onclick="openMenuModal('${rowId}')">
                        <span class="menu-name">Pilih Menu</span>
                    </a>
                </div>
                <div class="qty-col">
                    <label class="order-row-label">Qty</label>
                    <input type="number" class="qty-input" min="1" placeholder="Qty" oninput="calculateTotal()">
                </div>
                <div class="remove-col">
                    <button class="btn-remove" onclick="removeRow('${rowId}')">×</button>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHTML);
    }

    function removeRow(rowId) {
        document.getElementById(rowId).remove();
        calculateTotal();
    }

    function openMenuModal(rowId) {
        currentRowId = rowId;
        document.getElementById('menu-modal').style.display = 'block';
        document.getElementById('search-menu').focus();
        renderMenuList();
    }

    function closeMenuModal() {
        document.getElementById('menu-modal').style.display = 'none';
        document.getElementById('search-menu').value = '';
    }

    function renderMenuList() {
        const menuList = document.getElementById('menu-list');
        menuList.innerHTML = '';
        for (let item in menuItems) {
            const tag = document.createElement('button');
            tag.className = 'menu-item-tag';
            tag.innerText = item;
            tag.onclick = function() { selectMenuItem(item); };
            menuList.appendChild(tag);
        }
    }

    function filterMenuList() {
        const input = document.getElementById('search-menu');
        const filter = input.value.toLowerCase();
        const tags = document.getElementsByClassName('menu-item-tag');
        for (let i = 0; i < tags.length; i++) {
            const txtValue = tags[i].textContent || tags[i].innerText;
            tags[i].style.display = txtValue.toLowerCase().indexOf(filter) > -1 ? "" : "none";
        }
    }

    function selectMenuItem(menuName) {
        if (currentRowId) {
            const row = document.getElementById(currentRowId);
            row.querySelector('.menu-name').innerText = menuName;
            closeMenuModal();
            calculateTotal();
        }
    }

    // FUNGSI TAMPIL/SEMBUNYI KOLOM TUNAI
    function toggleCashSection() {
        const pembayaran = document.querySelector('input[name="pembayaran"]:checked').value;
        const cashSection = document.getElementById('cash-section');
        
        if (pembayaran === 'Cash') {
            cashSection.style.display = 'block';
        } else {
            cashSection.style.display = 'none';
            document.getElementById('cash-given').value = ''; // Reset input
        }
        calculateTotal(); // Update tampilan kembalian
    }

    // FUNGSI HITUNG TOTAL DAN KEMBALIAN
    function calculateTotal() {
        const rows = document.querySelectorAll('.order-row');
        let total = 0;

        rows.forEach(row => {
            const menuName = row.querySelector('.menu-name').innerText;
            const qty = parseInt(row.querySelector('.qty-input').value) || 0;
            if (menuName !== "Pilih Menu" && menuItems[menuName]) {
                total += menuItems[menuName] * qty;
            }
        });

        document.getElementById('total-price').innerText = total.toLocaleString('id-ID');
        
        // Logika Hitung Kembalian
        const cashGiven = parseInt(document.getElementById('cash-given').value) || 0;
        const changeAmountDisplay = document.getElementById('change-amount');
        const pembayaran = document.querySelector('input[name="pembayaran"]:checked').value;

        if (pembayaran === 'Cash' && cashGiven > 0) {
            if (cashGiven >= total) {
                const change = cashGiven - total;
                changeAmountDisplay.innerText = "Rp " + change.toLocaleString('id-ID');
                changeAmountDisplay.style.color = '#4CAF50'; // Warna Hijau (Cukup)
            } else {
                changeAmountDisplay.innerText = "Uang Kurang!";
                changeAmountDisplay.style.color = '#b71c1c'; // Warna Merah (Kurang)
            }
        } else {
            changeAmountDisplay.innerText = "Rp 0";
            changeAmountDisplay.style.color = '#333';
        }

        return total;
    }

    function submitData() {
        const station = document.getElementById('station').value;
        const shift = document.getElementById('shift').value;
        const pilot = document.getElementById('pilot').value;
        const pembayaran = document.querySelector('input[name="pembayaran"]:checked').value;
        const total = calculateTotal();

        if (!pilot) { alert("Nama Pilot Gerobak harus diisi!"); return; }
        if (total === 0) { alert("Belum ada menu yang dipilih!"); return; }

        // Validasi jika pembayaran tunai, uang tidak boleh kurang
        if (pembayaran === 'Cash') {
            const cashGiven = parseInt(document.getElementById('cash-given').value) || 0;
            if (cashGiven < total) {
                alert("Nominal uang tunai kurang dari total belanja!");
                return;
            }
        }

        const pesanan = [];
        let missingMenu = false;
        document.querySelectorAll('.order-row').forEach(row => {
            const menu = row.querySelector('.menu-name').innerText;
            const qty = parseInt(row.querySelector('.qty-input').value) || 0;
            if (menu === "Pilih Menu") { missingMenu = true; }
            if (menu !== "Pilih Menu" && qty > 0) { pesanan.push({ menu: menu, jumlah: qty }); }
        });

        if (missingMenu) { alert("Pastikan semua menu sudah dipilih!"); return; }

        // PERHATIKAN: Data cashGiven dan kembalian TIDAK dimasukkan ke payload
        const payload = { station: station, shift: shift, pilot: pilot, pesanan: pesanan, total: total, pembayaran: pembayaran };
        
        const btnSubmit = document.querySelector('.btn-submit');
        btnSubmit.innerText = "Mengirim...";
        btnSubmit.disabled = true;

        fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8', } })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'sukses'){
                alert("Transaksi berhasil dicatat!");
                document.getElementById('pilot').value = '';
                document.getElementById('order-row-container').innerHTML = '';
                document.getElementById('cash-given').value = ''; // Reset tunai
                addOrderRow();
                calculateTotal();
            } else { alert("Terjadi kesalahan: " + data.pesan); }
        })
        .catch(error => { alert("Gagal menghubungi server."); console.error('Error!', error.message); })
        .finally(() => { btnSubmit.innerText = "Kirim Transaksi"; btnSubmit.disabled = false; });
    }

    window.onload = function() {
        addOrderRow();
        renderMenuList();
        toggleCashSection(); // Set inisial
    };
    
    window.onclick = function(event) {
        if (event.target == document.getElementById('menu-modal')) {
            closeMenuModal();
        }
    }
</script>

</body>
</html>
